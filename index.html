<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本旅行 2026 🇯🇵</title>
  <meta name="description" content="日本旅行 2026 行程總覽" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- 頂部小標題 -->
  <header class="site-header">
    <span class="flag">🇯🇵</span>
    <span class="site-title">日本旅行 2026</span>
    <div id="rate-badge" class="rate-badge">
      <span id="rate-display">最新匯率：載入中…</span>
    </div>
  </header>

  <main class="main">
    <div id="itinerary-list" class="itinerary-list"></div>
    <p class="footer-note">✏️ 行程持續更新中…</p>
  </main>

  <!-- 浮動酒店導航按鈕 -->
  <div id="hotel-fab" class="hotel-fab" aria-label="導航回酒店" role="button" tabindex="0">
    <span class="hotel-fab-icon">🏨</span>
    <div class="hotel-fab-info">
      <span id="hotel-fab-name" class="hotel-fab-name">載入中…</span>
      <span class="hotel-fab-hint">點擊導航回酒店</span>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
