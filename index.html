<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本旅行 2026 🇯🇵</title>
  <meta name="description" content="日本旅行 2026 行程總覽" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- 頂部小標題 -->
  <header class="site-header">
    <span class="flag">🇯🇵</span>
    <span class="site-title">日本旅行 2026</span>
    <div id="sunset-badge" class="sunset-badge" style="display:none;">
      <span id="sunset-display">🌅 --:--</span>
    </div>
    <div id="rate-badge" class="rate-badge" role="button" tabindex="0">
      <span id="rate-display">最新匯率：載入中…</span>
    </div>
  </header>

  <main class="main">
    <div id="itinerary-list" class="itinerary-list"></div>
    <p class="footer-note">✏️ 行程持續更新中…</p>
  </main>

  <!-- 浮動按鈕組：暴雨備選 + 備忘 + 酒店 -->
  <div class="fab-group">
    <div id="rain-fab" class="rain-fab" title="暴雨備選預案 (墨田水族館)" aria-label="暴雨備選預案" role="button" tabindex="0">
      <span class="rain-fab-icon">☔</span>
    </div>
    <div id="memo-fab" class="memo-fab" title="核心備忘" aria-label="核心備忘" role="button" tabindex="0">
      <span class="memo-fab-icon">📋</span>
    </div>
    <div id="hotel-fab" class="hotel-fab" title="導航回酒店" aria-label="導航回酒店" role="button" tabindex="0">
      <span class="hotel-fab-icon">🏨</span>
      <div class="hotel-fab-info">
        <span id="hotel-fab-name" class="hotel-fab-name">載入中…</span>
        <span class="hotel-fab-hint">點擊導航回酒店</span>
      </div>
    </div>
  </div>

  <!-- 備忘彈窗 -->
  <div id="memo-overlay" class="modal-overlay">
    <div class="modal-popup memo-popup" id="memo-popup"></div>
  </div>
  <!-- 暴雨備選彈窗 -->
  <div id="rain-overlay" class="modal-overlay">
    <div class="modal-popup" id="rain-popup"></div>
  </div>
  <!-- 景點簡介彈窗 -->
  <div id="spot-overlay" class="modal-overlay">
    <div class="modal-popup" id="spot-popup"></div>
  </div>
  <!-- 匯率換算彈窗 -->
  <div id="rate-overlay" class="modal-overlay">
    <div class="modal-popup rate-popup">
      <div class="rate-popup-title">💱 快速換匯計算</div>
      <div class="rate-popup-row">
        <div class="rate-input-group">
          <span class="rate-currency-label">¥</span>
          <input id="rate-jpy-input" class="rate-input" type="number" inputmode="numeric" value="10000" />
          <span class="rate-unit">JPY</span>
        </div>
        <div class="rate-arrow">→</div>
        <div class="rate-result-group">
          <span class="rate-currency-label">$</span>
          <span id="rate-usd-result" class="rate-result">…</span>
          <span class="rate-unit">USD</span>
        </div>
      </div>
      <div class="rate-popup-presets">
        <button class="rate-preset" data-jpy="1000">¥1,000</button>
        <button class="rate-preset" data-jpy="5000">¥5,000</button>
        <button class="rate-preset" data-jpy="10000">¥10,000</button>
        <button class="rate-preset" data-jpy="50000">¥50,000</button>
      </div>
      <div id="rate-popup-note" class="rate-popup-note"></div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
